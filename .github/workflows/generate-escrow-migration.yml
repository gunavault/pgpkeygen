name: generate-escrow-migration

on:
  push:
    branches:
      - feature/client-passphrase-escrow
    paths:
      - lib/db/schema.ts
      - .github/workflows/generate-escrow-migration.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Generate Drizzle migration
        env:
          DATABASE_URL: postgres://unused:unused@127.0.0.1:5432/unused
        run: pnpm db:generate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: escrow-drizzle-migration
          path: drizzle
          if-no-files-found: error
