# Keep the "local" lines from your current file:
#   docker compose exec db cat /var/lib/postgresql/data/pg_hba.conf
# Then replace ALL "host" lines with the two below.

# TYPE   DATABASE   USER       ADDRESS           METHOD
host     pgpkeygen  pgpkeygen  172.30.0.10/32    scram-sha-256   # app container only
hostssl  pgpkeygen  splunk_ro  10.0.0.20/32      scram-sha-256   # Splunk server only, TLS required
