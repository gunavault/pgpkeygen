allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@next/env@16.3.4'
  - '@next/eslint-plugin-next@16.3.4'
  - '@next/swc-darwin-arm64@16.3.4'
  - '@next/swc-darwin-x64@16.3.4'
  - '@next/swc-linux-arm64-gnu@16.3.4'
  - '@next/swc-linux-arm64-musl@16.3.4'
  - '@next/swc-linux-x64-gnu@16.3.4'
  - '@next/swc-linux-x64-musl@16.3.4'
  - '@next/swc-win32-arm64-msvc@16.3.4'
  - '@next/swc-win32-x64-msvc@16.3.4'
  - eslint-config-next@16.3.4
  - next@16.3.4
  - nodemailer@9.1.0
overrides:
  # GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7, GHSA-q2hr-2g5m-vwhr: patched
  # releases on the same majors that minimatch@3 and minimatch@10 depend on.
  brace-expansion@<1.1.21: ^1.1.21
  brace-expansion@>=5.0.0 <5.0.12: ^5.0.12
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 has no patched release; reached only through ESLint
    # (eslint-config-next > @next/eslint-plugin-next > fast-glob > micromatch).
    # Dev tooling only, not in the production image. Recheck by 2026-11-05;
    # see TESTING.md.
    - GHSA-vfj7-8cjw-p6xm
